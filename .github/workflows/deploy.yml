name: MERN CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:

      ####################################################
      # Checkout Repository
      ####################################################

      - name: Checkout Repository
        uses: actions/checkout@v4

      ####################################################
      # Setup Node.js
      ####################################################

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      ####################################################
      # Verify Node & NPM
      ####################################################

      - name: Verify Node & NPM
        run: |
          node -v
          npm -v

      ####################################################
      # Install Frontend Dependencies
      ####################################################

      - name: Install Frontend Dependencies
        working-directory: client
        run: npm install

      ####################################################
      # Install Backend Dependencies
      ####################################################

      - name: Install Backend Dependencies
        working-directory: server
        run: npm install

      ####################################################
      # Configure AWS Credentials
      ####################################################

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-2

      ####################################################
      # Login to Amazon ECR
      ####################################################

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      ####################################################
      # Build Frontend Docker Image
      ####################################################

      - name: Build Frontend Docker Image
        run: |
          docker build \
            -t 305678528308.dkr.ecr.ap-south-2.amazonaws.com/employee-client:latest \
            ./client

      ####################################################
      # Build Backend Docker Image
      ####################################################

      - name: Build Backend Docker Image
        run: |
          docker build \
            -t 305678528308.dkr.ecr.ap-south-2.amazonaws.com/employee-server:latest \
            ./server

      ####################################################
      # Push Frontend Image
      ####################################################

      - name: Push Frontend Image
        run: |
          docker push 305678528308.dkr.ecr.ap-south-2.amazonaws.com/employee-client:latest

      ####################################################
      # Push Backend Image
      ####################################################

      - name: Push Backend Image
        run: |
          docker push 305678528308.dkr.ecr.ap-south-2.amazonaws.com/employee-server:latest

      ####################################################
      # Deploy to EC2
      ####################################################

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |

            echo "Logging into Amazon ECR..."

            aws ecr get-login-password --region ap-south-2 | docker login \
              --username AWS \
              --password-stdin \
              305678528308.dkr.ecr.ap-south-2.amazonaws.com

            echo "Pulling latest Docker images..."

            docker pull 305678528308.dkr.ecr.ap-south-2.amazonaws.com/employee-client:latest
            docker pull 305678528308.dkr.ecr.ap-south-2.amazonaws.com/employee-server:latest

            echo "Stopping old containers..."

            docker stop employee-client || true
            docker stop employee-server || true

            docker rm employee-client || true
            docker rm employee-server || true

            echo "Starting Backend..."

            docker run -d \
              --name employee-server \
              --restart unless-stopped \
              --env-file ~/Employee-Management-System-MERN-Full-Stack-Web-Application/server/.env \
              -p 5050:5050 \
              305678528308.dkr.ecr.ap-south-2.amazonaws.com/employee-server:latest

            echo "Starting Frontend..."

            docker run -d \
              --name employee-client \
              --restart unless-stopped \
              -p 5173:5173 \
              305678528308.dkr.ecr.ap-south-2.amazonaws.com/employee-client:latest

            echo "Removing unused Docker images..."

            docker image prune -f

            echo "Deployment Completed Successfully!"
